[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-template-project"
version = "0.1.0"
description = "A modern Python project template with uv, Ruff, ty, pytest, Nix/Devenv, and GitHub Actions CI"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.10"
authors = [
    { name = "0Mr-Panda0" }
]
keywords = ["python", "template", "nix", "devenv", "uv", "ruff", "ty", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
greetings = "greetings.cli:main"

[project.urls]
Homepage = "https://github.com/0Mr-Panda0/Python-Template-Project"
Repository = "https://github.com/0Mr-Panda0/Python-Template-Project"
Issues = "https://github.com/0Mr-Panda0/Python-Template-Project/issues"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "audit" },
    { include-group = "docs" },
]

lint = [
    "ruff>=0.16.7",
]

typecheck = [
    "ty>=0.0.80",
]

test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

audit = [
    "pip-audit>=2.8.0",
]

docs = [
    "pdoc>=15.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-vv --cov=greetings --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["greetings"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/greetings"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "README.md",
    "LICENSE",
]

[tool.ty]
# Configuration for Astral's ty type checker
