name: CI for Python CLI App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install devenv
        uses: devenv-sh/devenv-action@v1

      - name: Run Build Pipeline (Lint, Typecheck, Test)
        run: devenv shell build
