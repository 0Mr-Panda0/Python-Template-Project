name: CI for Python CLI App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Set up Cachix (Optimizes Nix package caching)
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install Devenv Tool CLI
        run: nix profile install nixpkgs#devenv

      - name: Run Linter and Formatter (Ruff)
        run: devenv shell lint

      - name: Run Type Checker (Ty)
        run: devenv shell typecheck

      - name: Run Unit Tests (Pytest)
        run: devenv shell test

  test-windows:
      runs-on: windows-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Install project dependencies
          run: uv sync

        - name: Run Linter and Formatter (Ruff)
          run: uvx ruff check . && uvx ruff format --check .

        - name: Run Type Checker (Ty)
          run: uvx ty check .

        - name: Run Unit Tests (Pytest)
          run: uv run python -m pytest -vv
