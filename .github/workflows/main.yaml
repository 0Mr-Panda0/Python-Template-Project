name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-nix:
    name: Test (Nix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Set up Cachix (Optimizes Nix package caching)
        uses: cachix/cachix-action@v15
        with:
          name: devenv

      - name: Install Devenv Tool CLI
        run: nix profile install nixpkgs#devenv

      - name: Run Formatter Check (Ruff)
        run: devenv shell format-check

      - name: Run Linter (Ruff)
        run: devenv shell lint

      - name: Run Type Checker (Ty)
        run: devenv shell typecheck

      - name: Run Unit Tests (Pytest)
        run: devenv shell test

      - name: Run Devenv Tests & Pre-commit Hooks
        run: devenv test

  test-normal:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --all-groups

      - name: Run Formatter Check (Ruff)
        run: uv run ruff format --check .

      - name: Run Linter (Ruff)
        run: uv run ruff check .

      - name: Run Type Checker (Ty)
        run: uv run ty check .

      - name: Run Unit Tests (Pytest)
        run: uv run pytest

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group audit

      - name: Run pip-audit
        run: uv run pip-audit

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Generate code coverage
        run: uv run pytest --cov=greetings --cov-report=lcov:lcov.info --cov-report=html:htmlcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            lcov.info
            htmlcov/
